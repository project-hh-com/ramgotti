[package]
name = "ramgotti"
version = "0.1.0"
description = "맥북 프리징을 때려잡는 화면 위 듀얼 메모리 청소 다마고치"
authors = ["dahee90522"]
edition = "2021"

[lib]
name = "ramgotti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "~2.0.0", features = [] }

[dependencies]
tauri = { version = "~2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "~2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.31"
