name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: pnpm install

      - name: Build Apple Silicon DMG (arm64)
        run: |
          pnpm tauri build --target aarch64-apple-darwin

      - name: Build Intel DMG (x64)
        run: |
          pnpm tauri build --target x86_64-apple-darwin

      - name: Collect and Rename DMGs
        run: |
          mkdir -p release
          # ARM64 DMG
          ARM_DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          cp "$ARM_DMG" release/RAMgotti-arm64.dmg

          # X64 DMG
          X64_DMG=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          cp "$X64_DMG" release/RAMgotti-x64.dmg

          ls -lh release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — uploading assets only"
            gh release upload "$GITHUB_REF_NAME" \
              release/RAMgotti-arm64.dmg \
              release/RAMgotti-x64.dmg \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/RAMgotti-arm64.dmg \
              release/RAMgotti-x64.dmg \
              --title "램고치 ${GITHUB_REF_NAME} 🐑" \
              --generate-notes
          fi

      - name: Update Homebrew Cask (Tap)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap update"
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          ARM_SHA="$(shasum -a 256 release/RAMgotti-arm64.dmg | awk '{print $1}')"
          X64_SHA="$(shasum -a 256 release/RAMgotti-x64.dmg   | awk '{print $1}')"

          TAP_DIR="$(mktemp -d)/homebrew-ramgotti"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/project-hh-com/homebrew-ramgotti.git" "$TAP_DIR" || exit 0

          CASK="$TAP_DIR/Casks/ramgotti.rb"
          mkdir -p "$TAP_DIR/Casks"

          python3 scripts/update-cask.py "$CASK" "$VERSION" "$ARM_SHA" "$X64_SHA"

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ramgotti.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
          else
            git commit -m "feat: bump ramgotti cask to v${VERSION}"
            git push origin main
          fi
